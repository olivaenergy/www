<main class="fill-remaining">
  <app-section [hasImage]="true" [imagePath]="'/images/ai_placeholder.png'" class="grid-center fill-remaining" style="height: 90vh">
    <div class="card flex-col flex-center background-frost-dark bleached-text" style="width: 50vw; height: 50vh;">
      <h1 class="text-left">{{ t.translate('page_3.section_1.heading') }}</h1>
      <div class="flex-row flex-center mt-md gap-sm" style="transform: translateX(-10%)">
        <div class="flex-col text-right gap-md">
          <label class="m-none l-text" for="name">{{ t.translate('page_3.section_1.label_1') }}</label>
          <label class="m-none l-text" for="phone">{{ t.translate('page_3.section_1.label_2') }}</label>
          <label class="m-none l-text" for="email">{{ t.translate('page_3.section_1.label_3') }}</label>
          <label class="m-none l-text" for="organisation">{{ t.translate('page_3.section_1.label_4') }}</label>
        </div>
        <div class="flex-col gap-md">
          <input style="width: 35vw; height: 3vh;" type="text" id="name" name="name">
          <input style="width: 35vw; height: 3vh;" type="tel" id="phone" name="phone">
          <input style="width: 35vw; height: 3vh;" type="email" id="email" name="email">
          <input style="width: 35vw; height: 3vh;" type="text" id="organisation" name="organisation">
        </div>
      </div>
    </div>
  </app-section>
</main>
