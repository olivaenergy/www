<main>
  <app-section [hasImage]="true" [imagePath]="'/images/image_01.jpeg'" class="l-height grid-center">
    <div class="card" style="left: 5%; width: 30rem;">
      <div class="flex-col gap-sm bleached-text">
        <p class="m-none big-dash">{{ t.translate('page_2.section_1.top_label') }}</p>
        <p class="m-none xl-text title" style="line-height: 1.25;">{{ t.translate('page_2.section_1.heading') }}</p>
        <p class="m-none small-text">{{ t.translate('page_2.section_1.subheading') }}</p>
      </div>
    </div>
  </app-section>
  <br/>
  <br/>
  <app-section class="m-text mt-lg pb-lg">
    <div class="flex-col flex-center gap-lg mt-lg">
      @for (i of [0,1,2,3,4]; track i)
      {
        <app-info-box [hasDash]="true" [isTitleGreen]="true" [hasButton]="false" [width]="'80vw'"
                      [title]="t.translate(`page_2.section_3.card_${i}.heading`)"
                      [subtitle]="t.translate(`page_2.section_3.card_${i}.body`)">
        </app-info-box>
        @if(i === 0)
        {
          <br/>
          <br/>
        }
      }
    </div>
  </app-section>
</main>
