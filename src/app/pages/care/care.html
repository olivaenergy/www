<main>
  <app-section [hasImage]="true" [imagePath]="'/images/image_01.png'" class="l-height grid-center">
    <div class="card" style="left: 5%; width: 30rem;">
      <div class="flex-col gap-sm bleached-text">
        <p class="m-none big-dash">{{ t.translate('page_1.section_1.top_label') }}</p>
        <p class="m-none xl-text title" style="line-height: 1.25;">{{ t.translate('page_1.section_1.heading') }}</p>
        <p class="m-none small-text">{{ t.translate('page_1.section_1.subheading') }}</p>
      </div>
    </div>
  </app-section>
  <br/>
  <br/>
  <app-section class="m-text mt-lg pb-lg">
    <div class="flex-col flex-center gap-lg mt-lg">
      @for (i of [0,1,2,3,4]; track i)
      {
        <app-info-box [hasDash]="true" [isTitleGreen]="true" [hasButton]="false" [width]="'80vw'"
                      [title]="t.translate(`page_1.section_2.card_${i}.heading`)"
                      [subtitle]="t.translate(`page_1.section_2.card_${i}.body`)">
        </app-info-box>
      }
      <app-info-box [hasDash]="true" [isTitleGreen]="true" [hasButton]="false" [title]="t.translate('page_1.section_2.card_5.heading')" [width]="'80vw'">
        <p class="s-text m-none text-left">{{ t.translate('page_1.section_2.card_5.body') }}</p>
        <div class="flex-row flex-center mt-md gap-sm">
          <div class="flex-col text-right gap-sm">
            <label class="m-none s-text" for="name">{{ t.translate('page_1.section_2.card_5.label_1') }}</label>
            <label class="m-none s-text" for="phone">{{ t.translate('page_1.section_2.card_5.label_2') }}</label>
            <label class="m-none s-text" for="email">{{ t.translate('page_1.section_2.card_5.label_3') }}</label>
            <label class="m-none s-text" for="organisation">{{ t.translate('page_1.section_2.card_5.label_4') }}</label>
          </div>
          <div class="flex-col gap-sm">
            <input type="text" id="name" name="name"/>
            <input type="tel" id="phone" name="phone"/>
            <input type="email" id="email" name="email"/>
            <input type="text" id="organisation" name="organisation"/>
          </div>
        </div>
      </app-info-box>
    </div>
  </app-section>
</main>
