<div class="app-root">
<nav>
  <div class="nav-body">
    <img class="logo" src="images/oliva-logo.png" alt="Oliva Energy Logo">
    <ul class="navigation">
      <li><a class="nav-menu-item" (click)="setPageIndex(0); $event.stopImmediatePropagation()">HOME</a></li>
      <li><a class="nav-menu-item" (click)="setPageIndex(1); $event.stopImmediatePropagation()">CARE</a></li>
      <li><a class="nav-menu-item" (click)="setPageIndex(2); $event.stopImmediatePropagation()">SYSTEMS</a></li>
      <li><a class="nav-menu-item" (click)="setPageIndex(3); $event.stopImmediatePropagation()">CONTACT</a></li>
    </ul>
  </div>
</nav>
  @switch (current_page_index)
  {
    @case (0) {
      <app-home></app-home>
    }
    @case (1) {
      <app-care></app-care>
    }
    @case (2) {
      <app-systems></app-systems>
    }
    @case (3) {
      <app-contact></app-contact>
    }
    @default {
      <p>DO: IMPL PAGE</p>
    }
  }
<footer>
  <p>Gouwepoort 1, 4901 RZ Zierikzee, The Netherlands. Copyright © 2025 Oliva Energy.</p>
</footer>
</div>
