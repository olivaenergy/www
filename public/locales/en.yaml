page_1:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Oliva Care"
    subheading: "Value you may not yet see or use. We will help you put it to work"
  section_2:
    card_0:
      heading: "Are you unknowingly paying too much?"
      body: "Many companies pay their energy bill every month, but not everyone checks this structurally:\n- Whether the energy contract is still appropriate\n- Whether optimization toward the grid operator is possible\n- Whether peak power levels are unnecessarily high\n- Whether flexibility remains unused\n\nContracts are becoming more complex. Grid costs are rising. Electrification is changing your consumption profile."
    card_1:
      heading: "What is Oliva Care?"
      body: "Oliva Care is independent energy management.\n\nWe are not involved in the supply of energy. We do not sell contracts. We represent only your interests.\n\nFor a fixed monthly fee we ensure that:\n- Your energy contract is correct in content\n- Your consumption is continuously monitored (Care Control)\n- Deviations are detected (Care Control)\n- Optimizations are proposed\n\nYou gain peace of mind, control and insight."
    card_2:
      heading: "Care vs Care Control"
      body: "Not every organization requires active control. That is why we offer two levels.\n\nCare\n- Independent contract review\n- Strategic advice\n- From €20 per month\n\nFor organizations that want certainty.\n\nCare Control\n- Everything from Care\n- Installation of Energy Box\n- Real-time analysis\n- Active power control\n- Optimization of PV, charging stations and peak loads\n- From €60 per month\n\nFor organizations that want to get more out of their energy infrastructure."
    card_3:
      heading: "Our position"
      body: "Oliva Energy is not an energy supplier.\n\nWe have no interest in which contract you choose.\n\nOur role is comparable to a financial advisor, but for energy.\n\nIndependent. Data-driven. Transparent."
    card_4:
      heading: "Frequently asked questions"
      body: "Are you independent from energy suppliers?\nYes. We do not supply energy and we receive no commission on contracts.\n\nI already have an energy advisor and they do not charge a monthly fee. Why should I pay you for the same advice?\nEnergy advisors often receive a kickback when they deliver a signed energy contract to a supplier. These kickback payments can become quite substantial.\n\nOliva Energy does NOT do this. The only compensation we receive is the monthly subscription fee. We do not advise based on the highest kickback. We advise based on your needs and in your best interest.\n\nDo I need to install hardware?\nNot for Care. For Care Control an Energy Box is required.\n\nHow quickly will I see results?\nOften already during the first contract analysis.\n\nIs this interesting for small businesses?\nYes. Especially companies without their own energy expertise benefit from Care."
    card_5:
      heading: "Control over energy starts with insight"
      body: "Leave your details and we will contact you."
