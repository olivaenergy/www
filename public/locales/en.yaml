    button_left: "Discover Care"
    button_right: "Discover Systems"
  section_2:
    text_top: "Oliva Energy helps organisations unlock the value of energy flexibility."
    text_bottom: "We combine data, monitoring and engineering to give organisations control over their energy."
  section_3:
    top_label: "Our clients"
    heading: "We offer tailored solutions"
    text_top: "For <b>energy suppliers</b>, <b>grid operators</b>, <b>installers</b> and <b>end users</b>, to unlock and manage flexibility in the energy system."
    text_bottom: "Through strategic partnership and our expertise, we create lasting value together for a future-proof energy system."
  section_4:
    top_label: "How we work"
    heading: "Two divisions, one mission"
    card_left:
      heading: "Oliva Care"
