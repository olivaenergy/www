    card_right:
      heading: "Oliva Systems"
      subheading: "For organisations where flexibility is a strategic factor"
      button: "Discover Systems"

page_1:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Oliva Care"
    subheading: "Value you don't yet see or use. We're going to put it to work for you"
  section_2:
    card_0:
      heading: "Are you unknowingly overpaying?"
      body:
        - "Many companies pay their energy bill every month, but not everyone consistently checks:"
        - "⋅ Whether the energy contract is still appropriate"
        - "⋅ Whether optimisation toward the grid operator is possible"
        - "⋅ Whether peak capacities are unnecessarily high"
        - "⋅ Whether flexibility is going unused"
        - ""
        - "Contracts are becoming more complex. Grid costs are rising. Electrification is changing your consumption profile."
    card_1:
      heading: "What is Oliva Care?"
      body:
        - "Oliva Care is independent energy management."
        - ""
        - "We are not in the business of supplying energy. We do not sell contracts. We represent your interests exclusively."
        - ""
        - "For a fixed monthly fee, we ensure that:"
        - "⋅ Your energy contract is correct in substance"
        - "⋅ Your consumption is continuously monitored (Care Control)"
        - "⋅ Anomalies are flagged (Care Control)"
        - "⋅ Optimisations are proposed"
        - ""
        - "You get peace of mind, control and insight."
    card_2:
      heading: "Care vs Care Control"
      body:
        - "Not every organisation needs active management. That's why we have two levels."
        - ""
        - "Care"
        - "⋅ Independent contract review"
        - "⋅ Strategic advice"
        - "⋅ From €20 per month"
        - ""
        - "For organisations that want certainty."
        - ""
        - "Care Control"
        - "⋅ Everything in Care"
        - "⋅ Installation of Energy Box"
        - "⋅ Real-time analysis"
        - "⋅ Active power management"
        - "⋅ Optimisation of PV, charging points and peaks"
        - "⋅ From €60 per month"
        - ""
        - "For organisations that want to get more out of their energy infrastructure."
    card_3:
      heading: "Our position"
      body:
        - "Oliva Energy is not an energy supplier."
        - ""
        - "We have no stake in your contract choice."
        - ""
        - "Our role is comparable to a financial advisor, but for energy."
        - ""
        - "Independent. Data-driven. Transparent."
    card_4:
      heading: "Frequently asked questions"
      body:
        - "Are you independent of energy suppliers?"
        - "Yes. We do not supply energy and receive no commission on contracts."
        - ""
        - "I already have an energy advisor who doesn't charge a monthly fee. Why would I pay you for the same advice?"
        - "Energy advisors often earn a kickback fee when they hand a signed energy contract to a supplier. These kickback fees can add up significantly."
        - ""
        - "Oliva Energy explicitly does NOT do this. The only fee we receive is the monthly subscription. We do not advise based on the highest kickback. We advise based on your needs and in your interest."
        - ""
        - "Do I need to install hardware?"
        - "Not for Care. For Care Control, an Energy Box is required."
        - ""
        - "How quickly will I see results?"
        - "Often as early as the first contract analysis."
        - ""
        - "Is this relevant for small businesses?"
        - "Yes. Especially companies without in-house energy expertise benefit from Care."

page_2:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Oliva Systems"
    subheading: "For organisations where Care is not enough"
  section_2:
    text_top: "From individual assets to one intelligent energy system."
    text_bottom: "For organisations where energy is a strategic factor."
  section_3:
    card_0:
      heading: "When Systems?"
      body:
        - "Many organisations have solar panels, charging points, batteries or heat pumps. These systems often still operate independently. As a result, a large portion of possible optimisation goes unrealised."
        - ""
        - "Oliva Systems ensures that all energy assets work together within one intelligent system."
    card_1:
      heading: "What does Oliva Systems do?"
      body:
        - "We design, integrate and optimise complete energy systems."
        - ""
        - "We do this through, among other things:"
        - "⋅ System design"
        - "⋅ Integration of energy assets"
        - "⋅ Energy monitoring"
        - "⋅ Power management"
        - "⋅ Flexibility optimisation"
        - ""
        - "The result is one central energy system that actively manages costs, capacity and efficiency."
    card_2:
      heading: "Who is Systems for?"
      body:
        - "Oliva Systems is relevant for organisations with:"
        - "⋅ Multiple energy assets"
        - "⋅ High energy demand"
        - "⋅ Peak capacities"
        - "⋅ Grid congestion challenges."
    card_3:
      heading: "From Care to Systems"
      body:
        - "Many organisations start with Oliva Care. This provides insight into energy usage and contract structures."
        - ""
        - "When greater optimisation potential is identified, scaling up to Oliva Systems becomes an option."
    card_4:
      heading: "Collaboration with installers"
      body:
        - "Oliva Systems works closely with installers and technical partners."
        - ""
        - "We focus on:"
        - "⋅ Analysis"
        - "⋅ System design"
        - "⋅ Energy management"
        - ""
        - "Installers handle the physical realisation of installations."

