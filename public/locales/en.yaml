page_2:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Oliva Systems"
    subheading: "For organisations where Care is not enough"
  section_2:
    text_top: "From separate assets to one intelligent energy system."
    text_bottom: "For organisations where energy is a strategic factor."
  section_3:
    card_0:
      heading: "When Systems?"
      body: "Many organisations have solar panels, charging stations, batteries or heat pumps. These systems often still operate independently. As a result, a large part of the possible optimisation goes unused. Oliva Systems ensures that all energy assets work together within one intelligent system."
    card_1:
      heading: "What does Oliva Systems do?"
      body: "We design, integrate and optimise complete energy systems.\nWe do this through:\n- System design\n- Integration of energy assets\n- Energy monitoring\n- Power management\n- Flexibility optimisation\n\nThis creates one central energy system that can actively manage costs, capacity and efficiency."
    card_2:
      heading: "Who is Systems for?"
      body: "Oliva Systems is relevant for organisations with multiple assets, high energy demand, peak loads or grid congestion challenges."
    card_3:
      heading: "From Care to Systems"
      body: "Many organisations start with Oliva Care, which provides insight into energy usage and contract structures.\n\nWhen greater optimisation proves possible, scaling up to Oliva Systems is an option."
    card_4:
      heading: "Collaboration with installers"
      body: "Oliva Systems works closely with installers and technical partners.\n\nWe focus on:\n- Analysis\n- System design\n- Energy management\n\nInstallers handle the physical realisation of installations."
    card_5:
      heading: "Interested?"
      body: "Does your organisation have multiple energy assets or complex energy usage? Leave your details to discuss the possibilities. We will get back to you within 2 business days."
