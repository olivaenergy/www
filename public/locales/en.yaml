      label_3: "Email:"
      label_4: "Organization:"

page_2:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Oliva Systems"
    subheading: "For organizations where Care is not sufficient"
  section_2:
    text_top: "From separate assets to one intelligent energy system."
    text_bottom: "For organizations where energy is a strategic factor."
  section_3:
    card_0:
      heading: "Why Systems?"
      body: "Many organizations have solar panels, charging stations, batteries or heat pumps. These systems often still operate separately. As a result, a large part of the possible optimization remains unused.\n\nOliva Systems ensures that all energy assets work together within one intelligent system."
    card_1:
      heading: "What does Oliva Systems do?"
      body: "We design, integrate and optimize complete energy systems.\n\nWe do this through:\n- System design\n- Integration of energy assets\n- Energy monitoring\n- Power control\n- Flexibility optimization\n\nThis creates one central energy system that can actively steer on cost, capacity and efficiency."
    card_2:
      heading: "Who is Systems for"
      body: "Oliva Systems is interesting for organizations with:\n- Multiple energy assets\n- High energy demand\n- Peak power usage\n- Grid congestion challenges."
    card_3:
      heading: "From Care to Systems"
      body: "Many organizations start with Oliva Care. This creates insight into energy usage and contract structures.\n\nWhen greater optimization opportunities become visible, organizations can scale up to Oliva Systems."
    card_4:
      heading: "Collaboration with installers"
      body: "Oliva Systems works closely with installers and technical partners.\n\nWe focus on:\n- Analysis\n- System design\n- Energy control\n\nInstallers are responsible for the realization of installations."
    card_5:
      heading: "Interested?"
      body: "Does your organization have multiple energy assets or complex energy usage?\n\nLeave your details to discuss the possibilities.\n\nWe will contact you within 2 working days."
