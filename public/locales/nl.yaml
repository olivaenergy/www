page_2:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Oliva Systems"
    subheading: "Voor organisaties waar Contact niet voldoende is"
  section_2:
    text_top: "Van losse assets naar één intelligent energiesysteem."
    text_bottom: "Voor organisaties waar energie een strategische factor is."
  section_3:
    card_0:
      heading: "Wanneer Systems?"
      body: "Veel organisaties beschikken over zonnepanelen, laadpalen, batterijen of warmtepompen. Deze systemen werken vaak nog los van elkaar. Daardoor blijft een groot deel van de mogelijke optimalisatie onbenut. Oliva Systems zorgt ervoor dat alle energie assets samenwerken binnen één intelligent systeem."
    card_1:
      heading: "Wat doet Oliva Systems?"
      body: "Wij ontwerpen, integreren en optimaliseren complete energiesystemen. Dat doen wij onder andere door: - Systeemontwerp - Integratie van energie assets - Energie monitoring - Vermogenssturing - Flexibiliteitsoptimalisatie Zo ontstaat één centraal energiesysteem dat actief kan sturen op kosten, capaciteit en efficiëntie."
    card_2:
      heading: "Voor wie is Systems"
      body: "Oliva Systems is interessant voor organisaties met meerdere assets, hoge energievraag, piekvermogens of netcongestie uitdagingen."
    card_3:
      heading: "Van Contact naar Systems"
      body: "Veel organisaties starten met Oliva Contact, daarmee ontstaat inzicht in energiegebruik en contractstructuren. Wanneer blijkt dat er grotere optimalisatie mogelijk is, kan worden opgeschaald naar Oliva Systems."
    card_4:
      heading: "Samenwerking met installateurs"
      body: "Oliva Systems werkt nauw samen met installateurs en technische partners. Wij focussen op: - Analyse - Systeemontwerp - Energiesturing Installateurs verzorgen de realisatie van installaties."
    card_5:
      heading: "Interesse?"
      body: "Heeft uw organisatie meerdere energie assets of complex energiegebruik? Laat uw gegevens achter om de mogelijkheden te bespreken. Wij nemen uiterlijk binnen 2 werkdagen contact met u op."
      label_1: "Naam:"
      label_2: "Telefoon:"
      label_3: "Email:"
      label_4: "Organisatie:"

