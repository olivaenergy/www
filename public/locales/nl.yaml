page_0:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Energieflexibiliteit heeft waarde"
    subheading: "Waarde die je nog niet ziet en gebruikt.<br/> Wij gaan het voor je Inzetten."
    button_left: "Ontdek Care"
    button_right: "Ontdek Systems"
  section_2:
    text_top: "Oliva Energy helpt organisaties de waarde van energieflexibiliteit te benutten."
    text_bottom: "Wij combineren data, monitoring en engineering<br/> om organisaties grip te geven op energie."
  section_3:
    top_label: "Onze klanten"
    heading: "Wij bieden maatwerkoplossingen"
    text_top: "Voor <b>energieleveranciers</b>, <b>netbeheerders</b>, <b>installateurs</b> en <b>eindgebruikers</b>, om flexibiliteit in het energiesysteem te ontsluiten en sturen."
    text_bottom: "Met strategisch partnerschap en onze expertise creëren we samen blijvende waarde voor een toekomstbestendig energiesysteem."
  section_4:
    top_label: "Hoe we werken"
    heading: "Twee afdelingen, één missie"
    card_left:
      heading: "Oliva Care"
      subheading: "De standaard voor professioneel energiemanagement"
      button: "Ontdek Care"
    card_right:
      heading: "Oliva Systems"
      subheading: "Voor organisaties waar flexibiliteit een strategische factor is"
      button: "Ontdek Systems"

page_1:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Oliva Care"
    subheading: "Waarde die je nog niet ziet en gebruikt. Wij gaan het voor je inzetten"
  section_2:
    card_0:
      heading: "Betaalt u niet ongemerkt te veel?"
      body:
        - "Veel bedrijven betalen maandelijks hun energierekening, maar niet iedereen controleert structureel:"
        - "⋅ Of het energiecontract nog passend is"
        - "⋅ Of er optimalisatie mogelijk is richting de netbeheerder"
        - "⋅ Of piekvermogens onnodig hoog zijn"
        - "⋅ Of flexibiliteit onbenut is"
        - ""
        - "Contracten worden complexer. Netbeheerkosten stijgen. Elektrificatie verandert uw verbruiksprofiel."
    card_1:
      heading: "Wat is Oliva Care?"
      body:
        - "Oliva Care is onafhankelijk energiemanagement."
        - ""
        - "Wij zitten niet in de levering van energie. Wij verkopen geen contracten. Wij vertegenwoordigen uitsluitend uw belang."
        - ""
        - "Voor een vast bedrag per maand zorgen wij dat:"
        - "⋅ Uw energiecontract inhoudelijk klopt"
        - "⋅ Uw verbruik continu wordt gemonitord (Care Control)"
        - "⋅ Afwijkingen worden gesignaleerd (Care Control)"
        - "⋅ Optimalisaties worden voorgesteld"
        - ""
        - "U krijgt rust, controle en inzicht."
    card_2:
      heading: "Care vs Care Control"
      body:
        - "Niet elke organisatie heeft actieve sturing nodig. Daarom hebben we twee niveaus."
        - ""
        - "Care"
        - "⋅ Onafhankelijke contractcontrole"
        - "⋅ Strategisch advies"
        - "⋅ Vanaf €20 per maand"
        - ""
        - "Voor organisaties die zekerheid willen."
        - ""
        - "Care Control"
        - "⋅ Alles van Care"
        - "⋅ Installatie van Energy Box"
        - "⋅ Real-time analyse"
        - "⋅ Actieve vermogenssturing"
        - "⋅ Optimalisatie van PV, laadpalen en pieken"
        - "⋅ Vanaf €60 per maand"
        - ""
        - "Voor organisaties die méér uit hun energie-infrastructuur willen halen."
    card_3:
      heading: "Onze positie"
      body:
        - "Oliva Energie is geen energieleverancier."
        - ""
        - "Wij hebben geen belang bij uw contractkeuze."
        - ""
        - "Onze rol is vergelijkbaar met een financieel adviseur, maar dan voor energie."
        - ""
        - "Onafhankelijk. Data-gedreven. Transparant."
    card_4:
      heading: "Veelgestelde vragen"
      body:
        - "Zijn jullie onafhankelijk van energieleveranciers?"
        - "Ja. Wij leveren geen energie en ontvangen geen commissie op contracten."
        - ""
        - "Ik heb een eigen energieadviseur en die vraagt geen maandelijkse vergoeding. Waarom zou ik wel een vergoeding aan jullie betalen voor hetzelfde advies?"
        - "Energieadviseurs verdienen vaak een kick-back vergoeding wanneer zij een getekend energiecontract kunnen overhandigen aan een energieleverancier. Deze kick-back vergoedingen kunnen flink oplopen."
        - ""
        - "Oliva Energy doet dit pertinent NIET. De enige vergoeding die wij ontvangen zijn de maandelijkse abonnementskosten. Wij adviseren niet op de hoogste kick-back vergoeding. Wij adviseren op basis van uw wensen in uw belang."
        - ""
        - "Moet ik hardware installeren?"
        - "Voor Care niet. Voor Care Control is een Energy Box nodig."
        - ""
        - "Hoe snel zie ik resultaat?"
        - "Vaak al bij de eerste contractanalyse."
        - ""
        - "Is dit interessant voor kleine bedrijven?"
        - "Ja. Juist bedrijven zonder eigen energie-expertise profiteren van Care."

page_2:
  section_1:
    top_label: "JOIN THE FLEXIBILITY TRANSITION"
    heading: "Oliva Systems"
    subheading: "Voor organisaties waar Contact niet voldoende is"
  section_2:
    text_top: "Van losse assets naar één intelligent energiesysteem."
    text_bottom: "Voor organisaties waar energie een strategische factor is."
  section_3:
    card_0:
      heading: "Wanneer Systems?"
      body:
        - "Veel organisaties beschikken over zonnepanelen, laadpalen, batterijen of warmtepompen. Deze systemen werken vaak nog los van elkaar. Daardoor blijft een groot deel van de mogelijke optimalisatie onbenut."
        - ""
        - "Oliva Systems zorgt ervoor dat alle energie assets samenwerken binnen één intelligent systeem."
    card_1:
      heading: "Wat doet Oliva Systems?"
      body:
        - "Wij ontwerpen, integreren en optimaliseren complete energiesystemen."
        - ""
        - "Dat doen wij onder andere door:"
        - "⋅ Systeemontwerp"
        - "⋅ Integratie van energie assets"
        - "⋅ Energie monitoring"
        - "⋅ Vermogenssturing"
        - "⋅ Flexibiliteitsoptimalisatie"
        - ""
        - "Zo ontstaat één centraal energiesysteem dat actief kan sturen op kosten, capaciteit en efficiëntie."
    card_2:
      heading: "Voor wie is Systems"
      body:
        - "Oliva Systems is interessant voor organisaties met:"
        - "⋅ Meerdere energie assets"
        - "⋅ Hoge energievraag"
        - "⋅ Piekvermogens"
        - "⋅ Netcongestie uitdagingen."
    card_3:
      heading: "Van Contact naar Systems"
      body:
        - "Veel organisaties starten met Oliva Contact. Daarmee ontstaat inzicht in energiegebruik en contractstructuren."
        - ""
        - "Wanneer blijkt dat er grotere optimalisatie mogelijk is, kan worden opgeschaald naar Oliva Systems."
    card_4:
      heading: "Samenwerking met installateurs"
      body:
        - "Oliva Systems werkt nauw samen met installateurs en technische partners."
        - ""
        - "Wij focussen op:"
        - "⋅ Analyse"
        - "⋅ Systeemontwerp"
        - "⋅ Energiesturing"
        - ""
        - "Installateurs verzorgen de realisatie van installaties."

