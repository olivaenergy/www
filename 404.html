    <button class="lang-btn" id="btn-de" onclick="setLang('de')">DE</button>
    <button class="lang-btn" id="btn-fr" onclick="setLang('fr')">FR</button>

<script src="lang/nl.js"></script>
<script src="lang/en.js"></script>
<script src="lang/de.js"></script>
<script src="lang/fr.js"></script>
<script src="lang/fi.js"></script>

<script>
  let currentLang = 'nl';

  function setLang(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;

    var titles = {
      nl: '404 - Pagina niet gevonden | Oliva Energy',
      en: '404 - Page not found | Oliva Energy',
      de: '404 - Seite nicht gefunden | Oliva Energy',
      fr: '404 - Page introuvable | Oliva Energy',
      fi: '404 - Sivua ei löydy | Oliva Energy'
    };
    document.title = titles[lang] || titles.nl;

    var langData = window.i18n && window.i18n[lang];
    if (langData) {
      document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (langData[key]) el.innerHTML = langData[key];
      });
    }

    ['nl','en','de','fr','fi'].forEach(function(l) {
      var btn = document.getElementById('btn-' + l);
      if (btn) btn.classList.toggle('active', l === lang);
    });
  }
</script>
