<p-panel class="panel-section" style="padding-inline: 7.5%;">
  <div class="dash-header text-oliva-green">
    <p [innerHtml]="t.translate('page_3.section_1.top_label')"></p>
    <h2 [innerHtml]="t.translate('page_3.section_1.heading')"></h2>
  </div>
  <div class="cards-grid" style="padding-block: 2rem">
    @for (i of [0, 1, 2, 3, 4, 5, 6, 7]; track i)
    {
      @let name = t.translate(`page_3.section_1.card_${i}.body`);
      <p-card [style]="{ width: '30rem', overflow: 'hidden' }">
        <ng-template #header>
          @if(name === `page_3.section_1.card_${i}.body`)
          {
            <p-skeleton style="padding: 1rem" width="100%" height="700px"></p-skeleton>
          }
          @else
          {
            @if(!imageLoaded[i])
            {
              <p-skeleton style="padding: 1rem" width="100%" height="700px"></p-skeleton>
            }
            <img alt="Card" style="border-radius: 12px; padding: 1rem; width: 100%"
              [style.display]="imageLoaded[i] ? 'block' : 'none'"
              [src]="`/images/staff/${name.toLowerCase().replaceAll(' ', '_')}.jpg`"
              (load)="imageLoaded[i] = true" (error)="imageLoaded[i] = true"/>
          }
        </ng-template>
        <ng-template #title> {{name}} </ng-template>
      </p-card>
    }
  </div>
  <p style="margin-left: -50%">{{ t.translate('page_3.section_1.contact') }}</p>
</p-panel>
